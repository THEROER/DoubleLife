# DoubleLife build targets — Minecraft compatibility range 1.21.6 .. 26.2.
#
# Selected with -Ptarget=mcXXXX (default below). The `minecraft` value must
# match the MagicUtils published +<minecraft> suffix for that target, because
# the consumer plugin resolves magicutils-* as <magicutils_version>+<minecraft>
# (e.g. 1.22.1+1.21.10). Keep these in sync with MagicUtils targets.properties.
#
# mc<major.minor> classifier per target:
#   mc12110 -> +1.21.10  (Mojang mappings + Paper remap, Java 21)
#   mc262   -> +26.2     (deobfuscated, Java 25)
target=mc12110

mc12110.minecraft=1.21.10
mc12110.java=21
mc12110.yarn=1.21.10+build.3
mc12110.loader=0.18.3
mc12110.fabric_api=0.138.4+1.21.10
mc12110.paper=1.21.11-R0.1-SNAPSHOT

mc2611.minecraft=26.1.1
mc2611.java=25
mc2611.yarn=1.21.11+build.4
mc2611.loader=0.19.2
mc2611.fabric_api=0.154.0+26.1.2
mc2611.paper=26.1.1.build.29-alpha

mc262.minecraft=26.2
mc262.java=25
mc262.yarn=1.21.11+build.4
mc262.loader=0.19.3
mc262.fabric_api=0.154.0+26.2
mc262.paper=26.2.build.40-alpha
